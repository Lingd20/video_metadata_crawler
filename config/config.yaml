# Video Metadata Crawler 配置文件
# 从 Bilibili / YouTube 爬取指定频道或播放列表的视频元数据

# 输入文件路径（TSV 格式，每行: name\ttype\tid）
input_file: "input/input_ae_2.txt"

# 输出配置
output:
  output_dir: "results"
  filename: "ae_2_metadata.xlsx"

# Cookies 文件路径（可选，留空或注释掉则不使用）
cookies:
  youtube: "config/youtube_cookies.txt"   # e.g. "config/youtube_cookies.txt"
  bilibili: "config/bilibili_cookies.txt"  # e.g. "config/bilibili_cookies.txt"

# Bilibili 爬取配置
bilibili:
  page_size: 50              # 每页数量（最大50）
  sleep_interval: 2          # 请求间隔（秒）
  error_sleep_interval: 30   # 错误后等待时间（秒）
  max_retries: 3             # 最大重试次数
  # cutoff_date: "2025-06-30"             # 截止日期（YYYY-MM-DD），早于此日期的视频将停止爬取；留空则不限制

# YouTube 爬取配置
youtube:
  sleep_interval: 5          # 请求间隔（秒）
  error_sleep_interval: 10   # 错误后等待时间（秒）
  metadata_batch_size: 50    # 每次获取的视频数量
  cutoff_date: "2024-12-30"             # 截止日期（YYYY-MM-DD），早于此日期的视频将停止爬取；留空则不限制

# 关键词过滤（可选）
# input 文件可在第 4 列填写 keyword_filter（profile 名称），例如：filter1
# 然后该 profile 在下面配置 positive keywords 与 negative keywords：
#
# keyword_filters:
#   filter1:
#     keywords: ["关键字1", "关键字2"]           # 标题或简介至少命中其一才通过
#     negative_keywords: ["负向关键词1", "负向关键词2"]  # 若命中任意负向关键词则直接拒绝
keyword_filters:
  movie:
    keywords: ["粤语中字", "粤语全集", "粤语版"]
    negative_keywords: ["国语", "中配"]

# 断点续传配置
checkpoint:
  checkpoint_dir: "checkpoints"
  save_interval: 50          # 每获取 N 个新视频保存一次 checkpoint

# 手动字幕单阶段流水线（scripts/subtitled_search_download/run.py）可选配置
# subtitled_download:
#   output_dir: "downloads"       # 下载根目录
#   task_name: ""                 # 留空则用 input 文件名
#   sub_langs: ""                 # 字幕语种，留空=all
#   sleep_interval: 2.0
#   output_excel: ""              # 可选：导出已下载视频的 Excel
